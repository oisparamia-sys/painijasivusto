name: Kilpailujen automaattihaku
on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
    inputs:
      year:
        description: 'Vuodet: auto, all tai missing = vain puuttuvat ottelukilpailut'
        type: choice
        default: auto
        options: [auto, all, missing, '2022', '2023', '2024', '2025', '2026']
      review_only:
        description: 'Käsittele vain ylläpidon päätökset (ei uutta lähdehakua)'
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
concurrency:
  group: kilpailuhaku
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PAINI_SOURCE_ARCHIVE: tietovarasto
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tarkista ottelutuonnin suojaukset
        run: |
          python tools/test-collect-bouts.py
          python tools/test-bout-sources.py
      - name: Testaa hyväksyntäjonon suojaukset
        run: node --test tools/test-review.cjs tools/test-identities.cjs tools/test-restore.cjs tools/test-refresh.cjs
      - name: Tallenna aiempi hyväksytty versio
        run: node tools/review-data.cjs snapshot . before
      - name: Käsittele ylläpidon päätökset
        run: node tools/review-data.cjs apply
      - name: Yhdistä samannimiset ja päivitä otteluviittaukset
        run: node tools/sync-identities.cjs
      - name: Hae ja tarkista lähteet
        if: ${{ inputs.review_only != true && inputs.year != 'missing' }}
        env:
          SEARCH_YEAR: ${{ inputs.year || 'auto' }}
        run: python tools/collect.py "$SEARCH_YEAR"
      - name: Päivitä aineisto
        if: ${{ inputs.review_only != true && inputs.year != 'missing' }}
        run: node tools/update-data.cjs
      - name: Kohdista uusien tulosten otteluviittaukset
        run: node tools/sync-identities.cjs
      - name: Hae ja tarkista ottelut
        if: ${{ inputs.review_only != true }}
        env:
          SEARCH_YEAR: ${{ inputs.year || 'auto' }}
        run: python tools/collect-bouts.py --year "$SEARCH_YEAR"
      - name: Päivitä otteluiden hyväksyntäjono
        if: ${{ inputs.review_only != true }}
        run: node tools/review-data.cjs ingest
      - name: Tee kevyt otteluaineisto sivustolle
        run: node tools/export-bouts.cjs
      - name: Tallenna hyväksytty aineistoversio
        run: node tools/review-data.cjs snapshot . after
      - name: Näytä otteluhaun yhteenveto
        if: ${{ always() && inputs.review_only != true }}
        run: |
          if [ -f ottelut-raportti.md ]; then
            cat ottelut-raportti.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Tallenna muutokset GitHubiin
        run: |
          if ! git diff --quiet -- data.js haun-tila.json ottelut-data.js ottelut-raportti.json ottelut-raportti.md ottelut-public.json ottelut-manifest.json muutosjono.json hyvaksyntapaatokset.json tietovarasto || [ -n "$(git ls-files --others --exclude-standard haun-tila.json ottelut-data.js ottelut-raportti.json ottelut-raportti.md ottelut-public.json ottelut-manifest.json muutosjono.json hyvaksyntapaatokset.json tietovarasto)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data.js haun-tila.json ottelut-data.js ottelut-raportti.json ottelut-raportti.md ottelut-public.json ottelut-manifest.json muutosjono.json hyvaksyntapaatokset.json tietovarasto
            git commit -m "Päivitä kilpailut ja ottelut automaattihaulla"
            git push origin HEAD:main
          fi
      - name: Pyydä sivuston julkaisu
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
      - name: Säilytä hakuraportti
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kilpailuhaun-raportti
          path: |
            hakuraportti.md
            ottelut-raportti.json
            ottelut-raportti.md
            muutosjono.json
            tietovarasto/
          retention-days: 90
          if-no-files-found: ignore
