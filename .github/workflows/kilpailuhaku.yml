name: Kilpailujen automaattihaku
on:
  schedule:
    - cron: '23 4 * * 1-4'
      timezone: Europe/Helsinki
    - cron: '23 */3 * * 0,5,6'
      timezone: Europe/Helsinki
  workflow_dispatch:
    inputs:
      year:
        description: 'auto, all, missing tai vuosiluku (2020–kuluva vuosi)'
        type: string
        default: auto
      review_only:
        description: 'Käsittele vain ylläpidon päätökset (ei uutta lähdehakua)'
        type: boolean
        default: false
permissions:
  actions: read
  contents: write
  pages: write
concurrency:
  group: kilpailuhaku
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/github-script@v7
        id: check
        with:
          script: |
            const gate = require('./tools/scan-gate.cjs');
            core.setOutput('allowed', String(await gate.allowed({github,context,core})));
  update:
    needs: gate
    if: needs.gate.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PAINI_SOURCE_ARCHIVE: tietovarasto
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tarkista ottelutuonnin suojaukset
        run: |
          python tools/test-collect-bouts.py
          python tools/test-bout-sources.py
          python tools/test-partial-results.py
          python tools/test-years.py
          python tools/test-scan-pipeline.py
          python tools/test-shared-database.py
          python tools/test-fetch-cache.py
      - name: Testaa hyväksyntäjonon suojaukset
        run: node --test tools/test-review.cjs tools/test-identities.cjs tools/test-restore.cjs tools/test-refresh.cjs tools/test-site-utils.cjs tools/test-i18n.cjs tools/test-bouts-ui.cjs tools/test-review-ui.cjs tools/test-site-metrics.cjs tools/test-coverage-history.cjs tools/test-theme.cjs tools/test-data-access.cjs tools/test-scan-gate.cjs tools/test-home-settings.cjs tools/test-bout-report-admin.cjs tools/test-mobile-ui.cjs tools/test-export-results.cjs tools/test-notifications.cjs
      - name: Suorita yhteinen kilpailu- ja otteluhaku
        env:
          SEARCH_YEAR: ${{ inputs.year || 'auto' }}
          REVIEW_ONLY: ${{ inputs.review_only || false }}
        run: |
          args=("$SEARCH_YEAR")
          if [ "$REVIEW_ONLY" = "true" ]; then args+=(--review-only); fi
          python tools/run-scan.py "${args[@]}"
      - name: Näytä otteluhaun yhteenveto
        if: ${{ always() && inputs.review_only != true }}
        run: |
          if [ -f ottelut-raportti.md ]; then
            cat ottelut-raportti.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Tallenna muutokset GitHubiin
        run: |
          if ! git diff --quiet -- tietokanta.sqlite.gz tietokanta-tila.json database-public-index.json database-issues.json data.js tulokset haun-tila.json ottelut-data.js ottelut-raportti.json ottelut-raportti.md ottelut-public.json ottelut-manifest.json kattavuus.json kattavuushistoria.json aineisto-manifest.json muutosjono.json hyvaksyntapaatokset.json tietovarasto || [ -n "$(git ls-files --others --exclude-standard tietokanta.sqlite.gz tietokanta-tila.json database-public-index.json database-issues.json tulokset haun-tila.json ottelut-data.js ottelut-raportti.json ottelut-raportti.md ottelut-public.json ottelut-manifest.json kattavuus.json kattavuushistoria.json aineisto-manifest.json muutosjono.json hyvaksyntapaatokset.json tietovarasto)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tietokanta.sqlite.gz tietokanta-tila.json database-public-index.json database-issues.json data.js tulokset haun-tila.json ottelut-data.js ottelut-raportti.json ottelut-raportti.md ottelut-public.json ottelut-manifest.json kattavuus.json kattavuushistoria.json aineisto-manifest.json muutosjono.json hyvaksyntapaatokset.json tietovarasto
            git commit -m "Päivitä kilpailut ja ottelut automaattihaulla"
            git push origin HEAD:main
          fi
      - name: Pyydä sivuston julkaisu
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
      - name: Säilytä hakuraportti
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kilpailuhaun-raportti
          path: |
            hakuraportti.md
            ottelut-raportti.json
            ottelut-raportti.md
            muutosjono.json
            tietovarasto/
          retention-days: 90
          if-no-files-found: ignore
